<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digitální Jízdní List v12</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .marquee-container { overflow: hidden; white-space: nowrap; display: flex; align-items: center; width: 100%; }
        .marquee-text { display: inline-block; padding-right: 40px; animation: marquee 8s linear infinite; }
        .screenshot-mode .marquee-text { animation: none !important; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        .dragging { opacity: 0.4; background-color: #334155 !important; }
        .screenshot-mode .no-capture { display: none !important; }
        .details-pane { max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; }
        .details-expanded .details-pane { max-height: 250px; transition: max-height 0.25s ease-in; }
        
        /* Světlý motiv */
        body.light-theme { background-color: #f1f5f9; color: #0f172a; }
        body.light-theme #captureArea { background-color: #f1f5f9; }
        body.light-theme .bg-\[\#1e293b\] { background-color: #ffffff !important; border-color: #cbd5e1 !important; }
        body.light-theme .bg-\[\#0f172a\] { background-color: #f8fafc !important; border-color: #cbd5e1 !important; }
        body.light-theme .text-white { color: #0f172a !important; }
        body.light-theme input, body.light-theme textarea { background-color: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
    </style>
</head>
<body id="appBody" class="bg-[#0f172a] text-slate-100 min-h-screen pb-36 transition-colors duration-200">

    <div id="captureArea" class="p-2 max-w-md mx-auto space-y-2 bg-[#0f172a]">

        <!-- Navigační / Formulářový panel -->
        <div id="navPanel" class="bg-[#1e293b] border border-[#334155] rounded-xl p-3 shadow-xl transition-colors duration-200">
            <div class="flex items-center justify-between gap-2">
                <div>
                    <h1 id="mainTitle" class="text-base font-black tracking-tight text-white flex items-center gap-1.5">
                        <span>📋 Jízdní List</span>
                        <button onclick="toggleTheme()" class="text-xs bg-[#334155] border border-[#475569] px-1.5 py-0.5 rounded-md active:scale-95 no-capture">🌓</button>
                    </h1>
                </div>
                
                <div class="flex gap-1 font-mono text-[11px]">
                    <div class="bg-[#022c22] border border-[#065f46] px-2 py-0.5 rounded-lg text-center min-w-[50px]">
                        <span class="block text-[8px] text-[#34d399] font-bold uppercase">Tam</span>
                        <span id="globalTotalTam" class="font-black text-[#34d399] text-xs">0</span>
                    </div>
                    <div class="bg-[#1e1b4b] border border-[#3730a3] px-2 py-0.5 rounded-lg text-center min-w-[50px]">
                        <span class="block text-[8px] text-[#818cf8] font-bold uppercase">Zpět</span>
                        <span id="globalTotalZpet" class="font-black text-[#818cf8] text-xs">0</span>
                    </div>
                    <div class="bg-[#451a03] border border-[#9a3412] px-2 py-0.5 rounded-lg text-center min-w-[75px]">
                        <span class="block text-[8px] text-[#fbbf24] font-bold uppercase">Kč Dnes</span>
                        <span id="globalTotalPenize" class="font-black text-[#fbbf24] text-xs">0</span>
                    </div>
                </div>
            </div>

            <div class="mt-2 no-capture">
                <button onclick="toggleFormCollapse()" id="collapseBtn" class="w-full py-1 bg-[#334155] hover:bg-[#475569] text-[10px] text-slate-300 font-bold rounded-md border border-[#475569] transition active:scale-[0.99]">
                    🔼 Schovat formulář jízdy
                </button>
            </div>

            <div id="collapsibleForm" class="grid grid-cols-2 gap-2 text-xs border-t border-[#334155] mt-2 pt-2">
                <div class="col-span-2">
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Jméno řidiče</label>
                    <input type="text" id="formJmeno" placeholder="Zadej své jméno..." class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white placeholder-slate-600">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Datum</label>
                    <input type="text" id="formDatum" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">SPZ vozidla</label>
                    <input type="text" id="formSpz" placeholder="Např. 1A2B345" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white uppercase placeholder-slate-600 text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Čas odjezdu</label>
                    <input type="time" id="formOdjezd" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Čas příjezdu</label>
                    <input type="time" id="formPrijezd" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Tachometr ZAČÁTEK</label>
                    <input type="number" id="formKmStart" placeholder="0" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white text-center placeholder-slate-700">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold mb-0.5 text-[10px]">Tachometr KONEC</label>
                    <input type="number" id="formKmEnd" placeholder="0" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 focus:outline-none text-white text-center placeholder-slate-700">
                </div>
                <div class="col-span-2 text-right pt-0.5">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Celkem ujeto: </span>
                    <span id="calculatedKm" class="font-mono font-black text-emerald-400 text-sm">0 km</span>
                </div>
            </div>
        </div>
        
        <!-- Hlavní akční tlačítka -->
        <div class="grid grid-cols-3 gap-1 text-[11px] font-bold no-capture">
            <button onclick="toggleFilter()" id="filterBtn" class="py-2 px-1 bg-[#1e293b] border border-[#334155] rounded-xl text-slate-300 active:scale-95 transition text-center truncate">
                👁️ Jen aktivní
            </button>
            <button onclick="toggleScreenshotMode()" id="screenshotBtn" class="py-2 px-1 bg-[#059669] text-white border border-[#059669] rounded-xl active:scale-95 transition text-center flex items-center justify-center gap-1">
                📸 Režim focení
            </button>
            <button onclick="archiveAndResetDay()" class="py-2 px-1 bg-[#4f46e5] border border-[#6366f1] text-indigo-100 rounded-xl active:scale-95 transition text-center flex flex-col items-center justify-center leading-tight">
                <span>💾 Uzavřít den</span>
                <span class="text-[8px] font-normal opacity-80">do archivu</span>
            </button>
        </div>

        <button id="exitScreenshotBtn" onclick="toggleScreenshotMode()" class="hidden fixed bottom-6 right-6 z-50 bg-[#dc2626] border border-[#ef4444] text-white text-xs font-black px-4 py-3 rounded-full shadow-2xl active:scale-95">
            ❌ Ukončit režim focení
        </button>

        <p id="tipText" class="text-[9px] text-slate-500 px-1 italic no-capture">Ťuknutím na název pobočky zobrazíš kontakt, mapu a otevíračku.</p>

        <!-- Seznam poboček -->
        <div id="rowsContainer" class="space-y-1"></div>

        <!-- Přidat novou pobočku -->
        <div id="customBox" class="bg-[#1e293b] border border-[#334155] p-2.5 rounded-xl space-y-1.5 mt-3 no-capture">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">➕ Přidat chybějící pobočku</h3>
            <div class="flex gap-1.5">
                <input type="text" id="customNameInput" placeholder="Název podniku..." class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-600 focus:outline-none">
                <button onclick="addCustomRow()" class="bg-[#475569] text-white px-3 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition">Přidat</button>
            </div>
        </div>

        <!-- Poznámky -->
        <div id="notesBox" class="bg-[#1e293b] border border-[#334155] p-3 rounded-xl space-y-1.5 mt-2">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">📝 Poznámky / Vrácené zboží</h3>
            <textarea id="formNotes" rows="2" placeholder="Zde zapiš reklamace, nesrovnalosti..." class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2 text-xs text-white placeholder-slate-600 focus:outline-none resize-none"></textarea>
        </div>

        <!-- Měsíční Archiv -->
        <div id="archiveBox" class="bg-[#1e293b] border border-[#334155] p-3 rounded-xl space-y-2 mt-2 no-capture">
            <div class="flex justify-between items-center border-b border-[#334155] pb-1.5">
                <h3 class="text-[10px] font-bold text-indigo-400 uppercase tracking-wide">📊 Celkový měsíční přehled</h3>
                <button onclick="resetMonthlyArchive()" class="text-[8px] bg-red-950/40 border border-red-900 text-red-400 px-1.5 py-0.5 rounded hover:bg-red-900 hover:text-white transition">Vynulovat měsíc</button>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center font-mono text-xs">
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Tam (Měsíc)</span>
                    <span id="archiveTotalTam" class="font-black text-emerald-400">0</span>
                </div>
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Zpět (Měsíc)</span>
                    <span id="archiveTotalZpet" class="font-black text-indigo-400">0</span>
                </div>
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Kč (Měsíc)</span>
                    <span id="archiveTotalPenize" class="font-black text-amber-400">0</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Registrace Service Workeru
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        const defaultList = [
            "68", "Anonymous", "Barevňák", "Barracuda", "Bělehradská", "Beroun-Lapaz", 
            "Berounský medvěd", "Bodeguita", "Boleslav", "Century", "Cisterna", "Cobra", 
            "Divadelní kavárna", "DLOUHÁ", "EL TORO", "Farma", "Florenc", "Garuda", 
            "Gate", "HDJ", "Horoměřice", "Host", "HUSA", "Chez nous", "IBIS", 
            "Icatering", "ITALSKÁ", "Kamila", "Karlínská perla", "Kladno-lapaz", 
            "Kobe", "Kozí", "Královice", "Krobian", "Linep", "Loď", "Lokál", 
            "Masná", "MEDUSA", "Nová kantýna", "NOVOTEL", "OLIVA", "Pointa", 
            "POKE", "PORKS", "Princ", "PŠTROS", "Racek", "Radiová", "Riegs", 
            "Rustonka", "Shock", "Staroch", "STATENICE", "Strašecí OBOJE", "Street", 
            "Strom", "SUCHDOL", "Sweet", "Špajz", "Štúrova", "Tkalec", "Třebešín", 
            "U Krbu", "U Ševce", "U Tellerů", "Věž", "Vodičkova PORKS", "Zahrada"
        ];

        const initialBranchDetails = {
            "Anonymous": { hours: "Po-Ne 16:00-02:00", phone: "+420123456789", address: "Michalská 12, Praha 1" },
            "Barracuda": { hours: "Po-Čt 11:00-23:00, Pá-So 11:00-01:00", phone: "+420987654321", address: "Krymská 2, Praha 10" },
            "Bodeguita": { hours: "Po-Ne 12:00-23:00", phone: "+420555666777", address: "Kaprova 5, Praha 1" },
            "DLOUHÁ": { hours: "Po-Ne 08:00-04:00", phone: "+420222333444", address: "Dlouhá 30, Praha 1" }
        };

        let appState = {
            onlyActiveFilter: false,
            theme: 'dark',
            formCollapsed: false,
            isScreenshotMode: false,
            formData: { jmeno: '', spz: '', odjezd: '', prijezd: '', kmStart: '', kmEnd: '', notes: '' },
            monthlyArchive: { tam: 0, zpet: 0, penize: 0 },
            branchDetails: {},
            order: [],
            data: {}
        };

        function initData() {
            const saved = localStorage.getItem('preprava_beden_state_v12');
            if (saved) {
                appState = JSON.parse(saved);
                appState.onlyActiveFilter = false;
                appState.isScreenshotMode = false;
                
                if (!appState.monthlyArchive) appState.monthlyArchive = { tam: 0, zpet: 0, penize: 0 };
                if (!appState.branchDetails) appState.branchDetails = {...initialBranchDetails};
                if (!appState.formData) appState.formData = { jmeno: '', spz: '', odjezd: '', prijezd: '', kmStart: '', kmEnd: '', notes: '' };
                
                defaultList.forEach(name => {
                    if (!appState.data[name]) appState.data[name] = { name: name, tam: 0, zpet: 0, penize: 0, custom: false };
                    if (!appState.order.includes(name)) appState.order.push(name);
                });
            } else {
                appState.order = [...defaultList];
                appState.branchDetails = {...initialBranchDetails};
                appState.monthlyArchive = { tam: 0, zpet: 0, penize: 0 };
                defaultList.forEach(name => {
                    appState.data[name] = { name: name, tam: 0, zpet: 0, penize: 0, custom: false };
                });
                saveToStorage();
            }
            
            document.getElementById('formJmeno').value = appState.formData.jmeno || '';
            document.getElementById('formSpz').value = appState.formData.spz || '';
            document.getElementById('formOdjezd').value = appState.formData.odjezd || '';
            document.getElementById('formPrijezd').value = appState.formData.prijezd || '';
            document.getElementById('formKmStart').value = appState.formData.kmStart || '';
            document.getElementById('formKmEnd').value = appState.formData.kmEnd || '';
            document.getElementById('formNotes').value = appState.formData.notes || '';

            const dnes = new Date();
            document.getElementById('formDatum').value = dnes.toLocaleDateString('cs-CZ');
            
            ['formJmeno', 'formSpz', 'formOdjezd', 'formPrijezd', 'formKmStart', 'formKmEnd', 'formNotes'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.addEventListener('input', (e) => {
                        const key = id.replace('form', '');
                        const stateKey = key.charAt(0).toLowerCase() + key.slice(1);
                        appState.formData[stateKey] = e.target.value;
                        saveToStorage();
                        if(stateKey === 'kmStart' || stateKey === 'kmEnd') calculateKmDiff();
                    });
                }
            });

            calculateKmDiff();
            applyThemeStyles();
            applyFormCollapse();
            renderRows();
            updateArchiveUI();
        }

        function calculateKmDiff() {
            const start = parseInt(appState.formData.kmStart) || 0;
            const end = parseInt(appState.formData.kmEnd) || 0;
            const textEl = document.getElementById('calculatedKm');
            if(end >= start && start > 0 && end > 0) {
                textEl.textContent = `${end - start} km`;
                textEl.className = "font-mono font-black text-emerald-400 text-sm";
            } else if (end < start && end > 0) {
                textEl.textContent = "Chybný konec";
                textEl.className = "font-mono font-black text-red-400 text-xs";
            } else {
                textEl.textContent = "0 km";
                textEl.className = "font-mono font-black text-amber-400 text-sm";
            }
        }

        function saveToStorage() {
            localStorage.setItem('preprava_beden_state_v12', JSON.stringify(appState));
            updateTotalsUI();
        }

        function toggleTheme() {
            appState.theme = appState.theme === 'light' ? 'dark' : 'light';
            saveToStorage();
            applyThemeStyles();
        }

        function applyThemeStyles() {
            if (appState.theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }

        function toggleFormCollapse() {
            appState.formCollapsed = !appState.formCollapsed;
            saveToStorage();
            applyFormCollapse();
        }

        function applyFormCollapse() {
            if (appState.isScreenshotMode) return; 
            const form = document.getElementById('collapsibleForm');
            const btn = document.getElementById('collapseBtn');
            if (appState.formCollapsed) {
                form.style.display = 'none';
                btn.textContent = "🔽 Zobrazit formulář jízdy";
            } else {
                form.style.display = 'grid';
                btn.textContent = "🔼 Schovat formulář jízdy";
            }
        }

        function toggleBranchDetails(el) {
            if (appState.isScreenshotMode) return;
            const parent = el.closest('.branch-card');
            parent.classList.toggle('details-expanded');
        }

        function updateBranchField(branchName, field, value) {
            if (!appState.branchDetails[branchName]) {
                appState.branchDetails[branchName] = { hours: '', phone: '', address: '' };
            }
            appState.branchDetails[branchName][field] = value;
            saveToStorage();
        }

        function renderRows() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';

            appState.order.forEach(name => {
                const item = appState.data[name];
                if (!item) return;

                const hasActive = item.tam > 0 || item.zpet > 0 || (item.penize || 0) > 0;
                if (appState.onlyActiveFilter && !hasActive) return;

                const details = appState.branchDetails[name] || { hours: '', phone: '', address: '' };

                const card = document.createElement('div');
                card.className = `branch-card bg-[#1e293b] border border-[#334155] rounded-xl p-2.5 transition-all shadow-md`;
                card.innerHTML = `
                    <div class="flex justify-between items-center gap-2">
                        <div onclick="toggleBranchDetails(this)" class="cursor-pointer flex-1 flex items-center gap-1.5 min-w-0">
                            <span class="font-bold text-white text-xs truncate hover:text-emerald-400 transition">${item.name}</span>
                            <span class="text-[9px] text-slate-500 no-capture">ℹ️</span>
                        </div>
                        <div class="flex items-center gap-1 font-mono text-xs">
                            <span class="text-emerald-400 bg-[#0f172a] border border-[#334155] px-1.5 py-0.5 rounded font-black">T:${item.tam}</span>
                            <span class="text-indigo-400 bg-[#0f172a] border border-[#334155] px-1.5 py-0.5 rounded font-black">Z:${item.zpet}</span>
                            <input type="number" value="${item.penize || ''}" placeholder="Kč" 
                                oninput="updateMoney('${item.name}', this.value)"
                                class="w-14 bg-[#0f172a] border border-[#334155] rounded px-1 py-0.5 text-amber-400 font-black text-center text-xs focus:outline-none placeholder-slate-700">
                        </div>
                    </div>

                    <!-- Ovládací tlačítka -->
                    <div class="grid grid-cols-4 gap-1 mt-2 no-capture">
                        <button onclick="changeVal('${item.name}', 'tam', 1)" class="bg-[#065f46] hover:bg-[#047857] text-emerald-200 py-1 rounded font-bold text-xs active:scale-95 transition">+Tam</button>
                        <button onclick="changeVal('${item.name}', 'tam', -1)" class="bg-[#334155] hover:bg-[#475569] text-slate-300 py-1 rounded font-bold text-xs active:scale-95 transition">-Tam</button>
                        <button onclick="changeVal('${item.name}', 'zpet', 1)" class="bg-[#3730a3] hover:bg-[#4338ca] text-indigo-200 py-1 rounded font-bold text-xs active:scale-95 transition">+Zpět</button>
                        <button onclick="changeVal('${item.name}', 'zpet', -1)" class="bg-[#334155] hover:bg-[#475569] text-slate-300 py-1 rounded font-bold text-xs active:scale-95 transition">-Zpět</button>
                    </div>

                    <!-- Rozbalovací panel kontaktů -->
                    <div class="details-pane no-capture mt-2 border-t border-[#334155] pt-2 space-y-1.5 text-[11px]">
                        <div class="grid grid-cols-2 gap-1.5">
                            <div>
                                <label class="block text-[9px] text-slate-400 font-bold uppercase">Telefon</label>
                                <input type="text" value="${details.phone || ''}" placeholder="+420..." 
                                    onchange="updateBranchField('${item.name}', 'phone', this.value)" 
                                    class="w-full bg-[#0f172a] border border-[#334155] rounded p-1 text-white">
                            </div>
                            <div>
                                <label class="block text-[9px] text-slate-400 font-bold uppercase">Otevírací doba</label>
                                <input type="text" value="${details.hours || ''}" placeholder="např. 10-22" 
                                    onchange="updateBranchField('${item.name}', 'hours', this.value)" 
                                    class="w-full bg-[#0f172a] border border-[#334155] rounded p-1 text-white">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 font-bold uppercase">Adresa / Mapa</label>
                            <div class="flex gap-1">
                                <input type="text" value="${details.address || ''}" placeholder="Ulice, Město" 
                                    onchange="updateBranchField('${item.name}', 'address', this.value)" 
                                    class="flex-1 bg-[#0f172a] border border-[#334155] rounded p-1 text-white">
                                ${details.address ? `<a href="https://maps.google.com/?q=${encodeURIComponent(details.address)}" target="_blank" class="bg-indigo-600 text-white px-2 py-1 rounded font-bold flex items-center justify-center">🗺️</a>` : ''}
                                ${details.phone ? `<a href="tel:${details.phone}" class="bg-emerald-600 text-white px-2 py-1 rounded font-bold flex items-center justify-center">📞</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updateTotalsUI();
        }

        function changeVal(name, key, delta) {
            if (!appState.data[name]) return;
            appState.data[name][key] = Math.max(0, (appState.data[name][key] || 0) + delta);
            saveToStorage();
            renderRows();
        }

        function updateMoney(name, val) {
            if (!appState.data[name]) return;
            appState.data[name].penize = parseInt(val) || 0;
            saveToStorage();
        }

        function updateTotalsUI() {
            let totalTam = 0, totalZpet = 0, totalPenize = 0;
            Object.values(appState.data).forEach(item => {
                totalTam += item.tam || 0;
                totalZpet += item.zpet || 0;
                totalPenize += item.penize || 0;
            });

            document.getElementById('globalTotalTam').textContent = totalTam;
            document.getElementById('globalTotalZpet').textContent = totalZpet;
            document.getElementById('globalTotalPenize').textContent = totalPenize;
        }

        function updateArchiveUI() {
            document.getElementById('archiveTotalTam').textContent = appState.monthlyArchive.tam || 0;
            document.getElementById('archiveTotalZpet').textContent = appState.monthlyArchive.zpet || 0;
            document.getElementById('archiveTotalPenize').textContent = appState.monthlyArchive.penize || 0;
        }

        function toggleFilter() {
            appState.onlyActiveFilter = !appState.onlyActiveFilter;
            const btn = document.getElementById('filterBtn');
            btn.className = appState.onlyActiveFilter 
                ? "py-2 px-1 bg-emerald-700 border border-emerald-500 rounded-xl text-white active:scale-95 transition text-center truncate"
                : "py-2 px-1 bg-[#1e293b] border border-[#334155] rounded-xl text-slate-300 active:scale-95 transition text-center truncate";
            renderRows();
        }

        function toggleScreenshotMode() {
            appState.isScreenshotMode = !appState.isScreenshotMode;
            const body = document.body;
            const exitBtn = document.getElementById('exitScreenshotBtn');

            if (appState.isScreenshotMode) {
                body.classList.add('screenshot-mode');
                exitBtn.classList.remove('hidden');
                document.getElementById('collapsibleForm').style.display = 'grid';
            } else {
                body.classList.remove('screenshot-mode');
                exitBtn.classList.add('hidden');
                applyFormCollapse();
            }
        }

        function addCustomRow() {
            const input = document.getElementById('customNameInput');
            const name = input.value.trim();
            if (!name) return;

            if (!appState.data[name]) {
                appState.data[name] = { name: name, tam: 0, zpet: 0, penize: 0, custom: true };
                appState.order.unshift(name);
                saveToStorage();
                renderRows();
            }
            input.value = '';
        }

        function archiveAndResetDay() {
            let totalTam = 0, totalZpet = 0, totalPenize = 0;
            Object.values(appState.data).forEach(item => {
                totalTam += item.tam || 0;
                totalZpet += item.zpet || 0;
                totalPenize += item.penize || 0;
            });

            if (totalTam === 0 && totalZpet === 0 && totalPenize === 0) {
                alert("Dnes nemáš zapsané žádné bedny ani hotovost k uložení.");
                return;
            }

            if (confirm(`Chceš uzavřít dnešní den a uložit tyto hodnoty do měsíčního archivu?\n\nTam: ${totalTam} | Zpět: ${totalZpet} | Kč: ${totalPenize}\n\nPo potvrzení se dnešní jízda vynuluje.`)) {
                appState.monthlyArchive.tam += totalTam;
                appState.monthlyArchive.zpet += totalZpet;
                appState.monthlyArchive.penize += totalPenize;

                Object.keys(appState.data).forEach(key => {
                    if (appState.data[key].custom) {
                        delete appState.data[key];
                    } else {
                        appState.data[key].tam = 0;
                        appState.data[key].zpet = 0;
                        appState.data[key].penize = 0;
                    }
                });

                appState.formData.odjezd = '';
                appState.formData.prijezd = '';
                appState.formData.kmStart = appState.formData.kmEnd;
                appState.formData.kmEnd = '';
                appState.formData.notes = '';

                document.getElementById('formOdjezd').value = '';
                document.getElementById('formPrijezd').value = '';
                document.getElementById('formKmStart').value = appState.formData.kmStart || '';
                document.getElementById('formKmEnd').value = '';
                document.getElementById('formNotes').value = '';

                appState.order = [...defaultList];
                saveToStorage();
                updateArchiveUI();
                renderRows();
            }
        }

        function resetMonthlyArchive() {
            if (confirm('Opravdu chceš vynulovat celý měsíční archiv?')) {
                appState.monthlyArchive = { tam: 0, zpet: 0, penize: 0 };
                saveToStorage();
                updateArchiveUI();
            }
        }

        // Spuštění po načtení
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
