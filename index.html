<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digitální Jízdní List</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .screenshot-mode .no-capture { display: none !important; }
    </style>
</head>
<body id="appBody" class="bg-[#0f172a] text-slate-100 min-h-screen pb-36 font-sans">

    <div id="captureArea" class="p-2 max-w-md mx-auto space-y-2">

        <!-- Horní panel -->
        <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-3 shadow-xl">
            <div class="flex items-center justify-between gap-2">
                <h1 class="text-base font-black text-white flex items-center gap-1.5">
                    <span>📋 Jízdní List</span>
                </h1>
                
                <div class="flex gap-1 font-mono text-[11px]">
                    <div class="bg-[#022c22] border border-[#065f46] px-2 py-0.5 rounded-lg text-center">
                        <span class="block text-[8px] text-[#34d399] font-bold uppercase">Tam</span>
                        <span id="globalTotalTam" class="font-black text-[#34d399] text-xs">0</span>
                    </div>
                    <div class="bg-[#1e1b4b] border border-[#3730a3] px-2 py-0.5 rounded-lg text-center">
                        <span class="block text-[8px] text-[#818cf8] font-bold uppercase">Zpět</span>
                        <span id="globalTotalZpet" class="font-black text-[#818cf8] text-xs">0</span>
                    </div>
                    <div class="bg-[#451a03] border border-[#9a3412] px-2 py-0.5 rounded-lg text-center">
                        <span class="block text-[8px] text-[#fbbf24] font-bold uppercase">Kč Dnes</span>
                        <span id="globalTotalPenize" class="font-black text-[#fbbf24] text-xs">0</span>
                    </div>
                </div>
            </div>

            <div class="mt-2 no-capture">
                <button onclick="toggleFormCollapse()" id="collapseBtn" class="w-full py-1 bg-[#334155] text-[10px] text-slate-300 font-bold rounded border border-[#475569]">
                    🔼 Schovat formulář jízdy
                </button>
            </div>

            <div id="collapsibleForm" class="grid grid-cols-2 gap-2 text-xs border-t border-[#334155] mt-2 pt-2">
                <div class="col-span-2">
                    <label class="block text-slate-400 font-semibold text-[10px]">Jméno řidiče</label>
                    <input type="text" id="formJmeno" placeholder="Zadej své jméno..." class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold text-[10px]">Datum</label>
                    <input type="text" id="formDatum" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 text-white text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold text-[10px]">SPZ vozidla</label>
                    <input type="text" id="formSpz" placeholder="Např. 1A2B345" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 text-white uppercase text-center">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold text-[10px]">Tachometr START</label>
                    <input type="number" id="formKmStart" placeholder="0" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 text-white text-center" oninput="calculateKm()">
                </div>
                <div>
                    <label class="block text-slate-400 font-semibold text-[10px]">Tachometr KONEC</label>
                    <input type="number" id="formKmEnd" placeholder="0" class="w-full bg-[#0f172a] border border-[#334155] rounded p-1.5 text-white text-center" oninput="calculateKm()">
                </div>
                <div class="col-span-2 text-right">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Celkem ujeto: </span>
                    <span id="calculatedKm" class="font-mono font-black text-emerald-400 text-sm">0 km</span>
                </div>
            </div>
        </div>
        
        <!-- Akční tlačítka -->
        <div class="grid grid-cols-2 gap-2 text-[11px] font-bold no-capture">
            <button onclick="toggleScreenshotMode()" class="py-2 bg-[#059669] text-white rounded-xl text-center">
                📸 Režim focení
            </button>
            <button onclick="archiveAndResetDay()" class="py-2 bg-[#4f46e5] text-indigo-100 rounded-xl text-center">
                💾 Uzavřít den
            </button>
        </div>

        <button id="exitScreenshotBtn" onclick="toggleScreenshotMode()" class="hidden fixed bottom-6 right-6 z-50 bg-[#dc2626] text-white text-xs font-black px-4 py-3 rounded-full shadow-2xl">
            ❌ Ukončit režim focení
        </button>

        <!-- Seznam hospod / poboček -->
        <div id="rowsContainer" class="space-y-1 mt-2"></div>

        <!-- Přidat novou pobočku -->
        <div class="bg-[#1e293b] border border-[#334155] p-2.5 rounded-xl space-y-1.5 mt-3 no-capture">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase">➕ Přidat pobočku / hospodu</h3>
            <div class="flex gap-1.5">
                <input type="text" id="customNameInput" placeholder="Název podniku..." class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-2.5 py-1.5 text-xs text-white">
                <button onclick="addCustomRow()" class="bg-[#475569] text-white px-3 py-1.5 rounded-lg text-xs font-bold">Přidat</button>
            </div>
        </div>

        <!-- Archiv -->
        <div class="bg-[#1e293b] border border-[#334155] p-3 rounded-xl space-y-2 mt-2 no-capture">
            <div class="flex justify-between items-center border-b border-[#334155] pb-1.5">
                <h3 class="text-[10px] font-bold text-indigo-400 uppercase">📊 Měsíční přehled</h3>
                <button onclick="resetMonthlyArchive()" class="text-[8px] bg-red-950/40 border border-red-900 text-red-400 px-1.5 py-0.5 rounded">Vynulovat měsíc</button>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center font-mono text-xs">
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Tam</span>
                    <span id="archiveTotalTam" class="font-black text-emerald-400">0</span>
                </div>
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Zpět</span>
                    <span id="archiveTotalZpet" class="font-black text-indigo-400">0</span>
                </div>
                <div class="bg-[#0f172a] p-1.5 rounded-lg border border-[#334155]">
                    <span class="block text-[8px] text-slate-500 uppercase font-sans">Kč</span>
                    <span id="archiveTotalPenize" class="font-black text-amber-400">0</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Výchozí seznam poboček
        const defaultVenues = [
            { id: 'v1', name: 'U Zlatého Lva' },
            { id: 'v2', name: 'Pivnice Na Růžku' },
            { id: 'v3', name: 'Restaurace U Parku' },
            { id: 'v4', name: 'Hospoda Pod Lipou' }
        ];

        let state = {
            venues: defaultVenues,
            counts: {},
            archive: { tam: 0, zpet: 0, penize: 0 }
        };

        // Načtení z paměti telefonu
        try {
            const saved = localStorage.getItem('jizdni_list_data_v13');
            if (saved) {
                state = JSON.parse(saved);
            }
        } catch(e) { console.error(e); }

        function saveState() {
            try {
                localStorage.setItem('jizdni_list_data_v13', JSON.stringify(state));
            } catch(e) {}
            updateTotals();
        }

        function calculateKm() {
            const start = parseFloat(document.getElementById('formKmStart').value) || 0;
            const end = parseFloat(document.getElementById('formKmEnd').value) || 0;
            const diff = (end >= start && start > 0) ? (end - start) : 0;
            document.getElementById('calculatedKm').innerText = diff + ' km';
        }

        function renderRows() {
            const container = document.getElementById('rowsContainer');
            if (!container) return;
            container.innerHTML = '';

            state.venues.forEach(v => {
                const c = state.counts[v.id] || { tam: 0, zpet: 0, penize: 0 };
                const div = document.createElement('div');
                div.className = 'bg-[#1e293b] border border-[#334155] p-2.5 rounded-xl text-xs space-y-1.5';
                div.innerHTML = `
                    <div class="flex justify-between items-center font-bold">
                        <span class="text-white text-sm">${v.name}</span>
                        <div class="flex gap-1 font-mono">
                            <span class="text-emerald-400 bg-[#0f172a] px-2 py-0.5 rounded">T: ${c.tam}</span>
                            <span class="text-indigo-400 bg-[#0f172a] px-2 py-0.5 rounded">Z: ${c.zpet}</span>
                            <span class="text-amber-400 bg-[#0f172a] px-2 py-0.5 rounded">${c.penize} Kč</span>
                        </div>
                    </div>
                    <div class="flex gap-1.5 no-capture pt-1">
                        <button onclick="adj('${v.id}','tam',1)" class="flex-1 bg-emerald-700 py-1.5 rounded-lg font-bold text-white active:scale-95 text-xs">+Tam</button>
                        <button onclick="adj('${v.id}','tam',-1)" class="w-9 bg-[#334155] py-1.5 rounded-lg font-bold text-slate-300 active:scale-95 text-xs">-</button>
                        <button onclick="adj('${v.id}','zpet',1)" class="flex-1 bg-indigo-700 py-1.5 rounded-lg font-bold text-white active:scale-95 text-xs">+Zpět</button>
                        <button onclick="adj('${v.id}','zpet',-1)" class="w-9 bg-[#334155] py-1.5 rounded-lg font-bold text-slate-300 active:scale-95 text-xs">-</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function adj(id, type, val) {
            if (!state.counts[id]) state.counts[id] = { tam: 0, zpet: 0, penize: 0 };
            state.counts[id][type] = Math.max(0, (state.counts[id][type] || 0) + val);
            saveState();
            renderRows();
        }

        function updateTotals() {
            let t = 0, z = 0, p = 0;
            Object.values(state.counts).forEach(c => {
                t += c.tam || 0;
                z += c.zpet || 0;
                p += c.penize || 0;
            });
            document.getElementById('globalTotalTam').innerText = t;
            document.getElementById('globalTotalZpet').innerText = z;
            document.getElementById('globalTotalPenize').innerText = p;
            document.getElementById('archiveTotalTam').innerText = state.archive.tam || 0;
            document.getElementById('archiveTotalZpet').innerText = state.archive.zpet || 0;
            document.getElementById('archiveTotalPenize').innerText = state.archive.penize || 0;
        }

        function addCustomRow() {
            const input = document.getElementById('customNameInput');
            const name = input.value.trim();
            if (!name) return;
            const id = 'v_' + Date.now();
            state.venues.push({ id, name });
            input.value = '';
            saveState();
            renderRows();
        }

        function archiveAndResetDay() {
            if (!confirm('Opravdu chceš uzavřít dnešní den a přičíst součty do měsíčního archivu?')) return;
            let t = 0, z = 0, p = 0;
            Object.values(state.counts).forEach(c => { t += c.tam || 0; z += c.zpet || 0; p += c.penize || 0; });
            state.archive.tam = (state.archive.tam || 0) + t;
            state.archive.zpet = (state.archive.zpet || 0) + z;
            state.archive.penize = (state.archive.penize || 0) + p;
            state.counts = {};
            saveState();
            renderRows();
        }

        function resetMonthlyArchive() {
            if (!confirm('Vynulovat celý měsíční archiv?')) return;
            state.archive = { tam: 0, zpet: 0, penize: 0 };
            saveState();
        }

        function toggleFormCollapse() {
            const f = document.getElementById('collapsibleForm');
            const btn = document.getElementById('collapseBtn');
            f.classList.toggle('hidden');
            btn.innerText = f.classList.contains('hidden') ? '🔽 Zobrazit formulář jízdy' : '🔼 Schovat formulář jízdy';
        }

        function toggleScreenshotMode() {
            document.body.classList.toggle('screenshot-mode');
            document.getElementById('exitScreenshotBtn').classList.toggle('hidden');
        }

        document.getElementById('formDatum').value = new Date().toLocaleDateString('cs-CZ');
        renderRows();
        updateTotals();
    </script>
</body>
</html>
